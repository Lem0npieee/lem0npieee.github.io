<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章详情</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="article-page">
      <a class="back-link" href="index.html">← 返回首页</a>
      <h1 id="article-title">文章标题</h1>
      <div id="article-content" class="article-content">正在加载...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const titleEl = document.getElementById("article-title");
      const contentEl = document.getElementById("article-content");
      const articleDir = "article";
      const attachmentsDir = "attachments";
      const defaultOwner = "lem0npieee";
      const defaultRepo = "lem0npieee.github.io";
      const host = window.location.hostname;
      const inferredOwner = host.endsWith("github.io")
        ? host.split(".")[0]
        : defaultOwner;
      const inferredRepo = host.endsWith("github.io")
        ? `${inferredOwner}.github.io`
        : defaultRepo;
      const repoOwner = inferredOwner;
      const repoName = inferredRepo;

      const normalizeImageUrl = (url) => {
        if (!url) {
          return "";
        }
        if (/^(https?:|data:|\/)/i.test(url)) {
          return url;
        }
        let cleaned = url.replace(/^\.\/+/, "");
        while (cleaned.startsWith("../")) {
          cleaned = cleaned.slice(3);
        }
        if (
          cleaned.startsWith(`${attachmentsDir}/`) ||
          cleaned.startsWith(`${articleDir}/${attachmentsDir}/`)
        ) {
          return cleaned;
        }
        return `${attachmentsDir}/${cleaned}`;
      };

      const renderMarkdown = (text) => {
        if (typeof marked === "undefined") {
          contentEl.textContent = "Markdown 渲染库加载失败，请稍后重试。";
          return;
        }
        const renderer = new marked.Renderer();
        renderer.image = (href, title, text) => {
          const src = normalizeImageUrl(href || "");
          const titleAttr = title ? ` title="${title}"` : "";
          const alt = text || "";
          return `<img src="${src}" alt="${alt}"${titleAttr}>`;
        };
        marked.setOptions({ breaks: true, renderer });
        contentEl.innerHTML = marked.parse(text);
      };

      const fetchFromSameOrigin = (fileName) =>
        fetch(`${articleDir}/${encodeURIComponent(fileName)}`).then((res) => {
          if (!res.ok) {
            throw new Error("same-origin");
          }
          return res.text();
        });

      const fetchFromGitHub = (fileName) => {
        const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${articleDir}/${encodeURIComponent(
          fileName
        )}`;
        return fetch(apiUrl)
          .then((res) => {
            if (!res.ok) {
              throw new Error("github-api");
            }
            return res.json();
          })
          .then((data) => {
            if (!data.content) {
              throw new Error("github-content");
            }
            const base64 = data.content.replace(/\n/g, "");
            const decoded = atob(base64);
            return decodeURIComponent(
              Array.from(decoded)
                .map((char) =>
                  `%${char.charCodeAt(0).toString(16).padStart(2, "0")}`
                )
                .join("")
            );
          });
      };

      if (!file || !/^[\w.-]+\.(md|markdown)$/i.test(file)) {
        titleEl.textContent = "无法读取文章";
        contentEl.textContent = "请从首页选择文章。";
      } else {
        titleEl.textContent = file
          .replace(/\.markdown$/i, "")
          .replace(/\.md$/i, "");
        fetchFromSameOrigin(file)
          .then((text) => {
            renderMarkdown(text);
          })
          .catch(() =>
            fetchFromGitHub(file)
              .then((text) => {
                renderMarkdown(text);
              })
              .catch(() => {
                contentEl.textContent =
                  "无法加载文章内容，请检查文件是否存在或仓库是否公开。";
              })
          );
      }
    </script>
  </body>
</html>
