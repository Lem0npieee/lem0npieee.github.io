<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章详情</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="article-page">
      <a class="back-link" href="index.html">← 返回首页</a>
      <h1 id="article-title">文章标题</h1>
      <div id="article-content" class="article-content">正在加载...</div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");
      const titleEl = document.getElementById("article-title");
      const contentEl = document.getElementById("article-content");
      const articleDir = "article";
      const attachmentsDir = "attachments";
      const defaultOwner = "lem0npieee";
      const defaultRepo = "lem0npieee.github.io";
      const host = window.location.hostname;
      const inferredOwner = host.endsWith("github.io")
        ? host.split(".")[0]
        : defaultOwner;
      const inferredRepo = host.endsWith("github.io")
        ? `${inferredOwner}.github.io`
        : defaultRepo;
      const repoOwner = inferredOwner;
      const repoName = inferredRepo;
      const pageBase = new URL("./", window.location.href);

      const normalizeImageUrl = (url) => {
        if (!url) {
          return "";
        }
        if (/^(https?:|data:|\/)/i.test(url)) {
          return url;
        }
        let cleaned = url.replace(/^\.\/+/, "");
        while (cleaned.startsWith("../")) {
          cleaned = cleaned.slice(3);
        }
        if (cleaned.startsWith(`${articleDir}/`)) {
          return new URL(cleaned, pageBase).toString();
        }
        if (cleaned.startsWith(`${attachmentsDir}/`)) {
          return new URL(`${articleDir}/${cleaned}`, pageBase).toString();
        }
        return new URL(`${articleDir}/${cleaned}`, pageBase).toString();
      };

      const escapeHtml = (value) =>
        value
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");

      const parseInline = (text, refs) => {
        const placeholders = [];
        const addPlaceholder = (html) => {
          const key = `@@@${placeholders.length}@@@`;
          placeholders.push(html);
          return key;
        };
        let working = text || "";
        const lookupRef = (key) => {
          if (!key || !refs) {
            return "";
          }
          const normalized = key.trim().toLowerCase();
          return refs[normalized] || "";
        };

        working = working.replace(/!\[\[([^\]]+)\]\]/g, (_, raw) => {
          const src = normalizeImageUrl(raw.trim());
          return addPlaceholder(`<img src="${src}" alt="">`);
        });

        working = working.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, raw, label) => {
          const target = raw.trim();
          const href = normalizeImageUrl(target);
          const safeLabel = escapeHtml((label || target).trim());
          return addPlaceholder(`<a href="${href}">${safeLabel}</a>`);
        });

        working = working.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => {
          const src = normalizeImageUrl(url.trim());
          const safeAlt = escapeHtml(alt || "");
          return addPlaceholder(`<img src="${src}" alt="${safeAlt}">`);
        });

        working = working.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
          const href = url.trim();
          const safeLabel = escapeHtml(label || "");
          return addPlaceholder(`<a href="${href}">${safeLabel}</a>`);
        });

        working = working.replace(/\[([^\]]+)\]\s*\[([^\]]*)\]/g, (_, label, refKey) => {
          const resolved = lookupRef(refKey || label);
          if (!resolved) {
            return _;
          }
          const safeLabel = escapeHtml(label || "");
          return addPlaceholder(`<a href="${resolved}">${safeLabel}</a>`);
        });

        working = working.replace(/<([^>]+)>/g, (_, raw) => {
          const trimmed = raw.trim();
          if (/^(https?:\/\/|mailto:)/i.test(trimmed)) {
            const safe = escapeHtml(trimmed);
            return addPlaceholder(`<a href="${safe}">${safe}</a>`);
          }
          if (/^www\./i.test(trimmed)) {
            const safe = escapeHtml(trimmed);
            return addPlaceholder(`<a href="http://${safe}">${safe}</a>`);
          }
          return `&lt;${escapeHtml(trimmed)}&gt;`;
        });

        working = working.replace(/\[\^([^\]]+)\]/g, (_, id) => {
          const safeId = escapeHtml(id);
          return addPlaceholder(
            `<sup id="fnref-${safeId}"><a href="#fn-${safeId}">${safeId}</a></sup>`
          );
        });

        const segments = working.split(/`/);
        const parsed = segments
          .map((segment, index) => {
            if (index % 2 === 1) {
              return `<code>${escapeHtml(segment)}</code>`;
            }
            let safe = escapeHtml(segment);
            safe = safe.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
            safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            safe = safe.replace(/\*([^*]+)\*/g, "<em>$1</em>");
            safe = safe.replace(/~~([^~]+)~~/g, "<del>$1</del>");
            safe = safe.replace(/==([^=]+)==/g, "<mark>$1</mark>");
            return safe;
          })
          .join("");

        return placeholders.reduce(
          (acc, html, index) => acc.replace(`@@@${index}@@@`, html),
          parsed
        );
      };

      const markdownToHtml = (text) => {
        const lines = (text || "").replace(/\r\n/g, "\n").split("\n");
        const refs = {};
        const footnotes = {};
        const footnoteOrder = [];

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i];
          const refMatch = line.match(/^\[([^\]]+)\]:\s+(.+)$/);
          if (refMatch) {
            refs[refMatch[1].trim().toLowerCase()] = refMatch[2].trim();
            lines[i] = "";
            continue;
          }
          const footnoteMatch = line.match(/^\[\^([^\]]+)\]:\s*(.*)$/);
          if (footnoteMatch) {
            const id = footnoteMatch[1].trim();
            const collected = [footnoteMatch[2] || ""];
            let j = i + 1;
            while (j < lines.length && /^\s{4,}|^\t/.test(lines[j])) {
              collected.push(lines[j].replace(/^\s{4}|^\t/, ""));
              lines[j] = "";
              j += 1;
            }
            lines[i] = "";
            footnotes[id] = collected.join("\n").trim();
            footnoteOrder.push(id);
          }
        }
        let html = "";
        let inCode = false;
        let codeLang = "";
        let codeLines = [];
        let listStack = [];
        let blockquoteLevel = 0;
        let inIndentedCode = false;
        let indentedCodeLines = [];

        const closeBlockquotes = () => {
          while (blockquoteLevel > 0) {
            html += "</blockquote>";
            blockquoteLevel -= 1;
          }
        };

        const closeLists = (targetLevel = 0) => {
          while (listStack.length > targetLevel) {
            const last = listStack.pop();
            html += `</${last}>`;
          }
        };

        const flushList = () => {
          closeLists(0);
        };

        const flushCode = () => {
          if (!inCode) {
            return;
          }
          const code = escapeHtml(codeLines.join("\n"));
          const langClass = codeLang ? ` class="language-${escapeHtml(codeLang)}"` : "";
          html += `<pre><code${langClass}>${code}</code></pre>`;
          inCode = false;
          codeLang = "";
          codeLines = [];
        };

        const flushIndentedCode = () => {
          if (!inIndentedCode) {
            return;
          }
          const code = escapeHtml(indentedCodeLines.join("\n"));
          html += `<pre><code>${code}</code></pre>`;
          inIndentedCode = false;
          indentedCodeLines = [];
        };

        const splitTableRow = (row) => {
          let trimmed = row.trim();
          if (trimmed.startsWith("|")) {
            trimmed = trimmed.slice(1);
          }
          if (trimmed.endsWith("|")) {
            trimmed = trimmed.slice(0, -1);
          }
          return trimmed.split("|").map((cell) => cell.trim());
        };

        const isTableSeparator = (row) =>
          /^(\s*\|)?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+(\|)?\s*$/.test(row);

        const renderTable = (startIndex) => {
          const header = splitTableRow(lines[startIndex]);
          let index = startIndex + 2;
          const bodyRows = [];
          while (index < lines.length) {
            const row = lines[index];
            if (!row.trim() || !row.includes("|")) {
              break;
            }
            bodyRows.push(splitTableRow(row));
            index += 1;
          }
          const headerHtml = header
            .map((cell) => `<th>${parseInline(cell, refs)}</th>`)
            .join("");
          const bodyHtml = bodyRows
            .map(
              (row) =>
                `<tr>${row
                  .map((cell) => `<td>${parseInline(cell, refs)}</td>`)
                  .join("")}</tr>`
            )
            .join("");
          html += `<table><thead><tr>${headerHtml}</tr></thead><tbody>${bodyHtml}</tbody></table>`;
          return index;
        };

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i];
          if (line.startsWith("```")) {
            flushIndentedCode();
            if (inCode) {
              flushCode();
            } else {
              flushList();
              closeBlockquotes();
              inCode = true;
              codeLang = line.slice(3).trim();
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (!line.trim()) {
            flushList();
            closeBlockquotes();
            continue;
          }

          const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
          if (headingMatch) {
            flushList();
            closeBlockquotes();
            const level = headingMatch[1].length;
            html += `<h${level}>${parseInline(headingMatch[2], refs)}</h${level}>`;
            const nextIsSetext =
              i + 1 < lines.length && /^(=+|-+)\s*$/.test(lines[i + 1]);
            if (nextIsSetext) {
              html += "<hr>";
              i += 1;
            }
            continue;
          }

          const setextMatch =
            i + 1 < lines.length ? lines[i + 1].match(/^(=+|-+)\s*$/) : null;
          if (setextMatch) {
            flushList();
            closeBlockquotes();
            const level = setextMatch[1].startsWith("=") ? 1 : 2;
            html += `<h${level}>${parseInline(line.trim(), refs)}</h${level}>`;
            i += 1;
            continue;
          }

          const blockquoteMatch = line.match(/^(>+)\s?(.*)$/);
          if (blockquoteMatch) {
            flushList();
            const targetLevel = blockquoteMatch[1].length;
            while (blockquoteLevel < targetLevel) {
              html += "<blockquote>";
              blockquoteLevel += 1;
            }
            while (blockquoteLevel > targetLevel) {
              html += "</blockquote>";
              blockquoteLevel -= 1;
            }
            if (blockquoteMatch[2]) {
              html += `<p>${parseInline(blockquoteMatch[2], refs)}</p>`;
            }
            continue;
          }

          closeBlockquotes();

          if (/^(\*\s*\*\s*\*|-{3,}|_{3,}|={3,})\s*$/.test(line)) {
            flushList();
            html += "<hr>";
            continue;
          }

          if (line.includes("|") && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
            flushList();
            i = renderTable(i) - 1;
            continue;
          }

          const listMatch = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
          if (listMatch) {
            if (inIndentedCode) {
              flushIndentedCode();
            }
            const indent = listMatch[1].replace(/\t/g, "    ").length;
            const depth = Math.floor(indent / 2) + 1;
            const type = /\d+\./.test(listMatch[2]) ? "ol" : "ul";
            if (listStack.length > depth) {
              closeLists(depth);
            }
            if (listStack.length === depth && listStack[listStack.length - 1] !== type) {
              closeLists(depth);
            }
            while (listStack.length < depth) {
              listStack.push(type);
              html += `<${type}>`;
            }
            let itemText = listMatch[3];
            const taskMatch = itemText.match(/^\[([ xX])\]\s+(.*)$/);
            if (taskMatch) {
              const checked = taskMatch[1].toLowerCase() === "x" ? " checked" : "";
              itemText = taskMatch[2];
              html += `<li class="task-item"><input type="checkbox" disabled${checked}>${parseInline(
                itemText,
                refs
              )}</li>`;
            } else {
              html += `<li>${parseInline(itemText, refs)}</li>`;
            }
            continue;
          }

          if (/^\s{4,}|^\t/.test(line)) {
            flushList();
            closeBlockquotes();
            inIndentedCode = true;
            indentedCodeLines.push(line.replace(/^\s{4}|^\t/, ""));
            continue;
          }
          if (inIndentedCode) {
            flushIndentedCode();
          }

          flushList();
          html += `<p>${parseInline(line, refs)}</p>`;
        }

        flushList();
        flushCode();
        flushIndentedCode();
        closeBlockquotes();

        if (footnoteOrder.length) {
          const footnoteItems = footnoteOrder
            .map((id) => {
              const safeId = escapeHtml(id);
              const body = parseInline(footnotes[id] || "", refs);
              return `<li id="fn-${safeId}">${body} <a href="#fnref-${safeId}">↩</a></li>`;
            })
            .join("");
          html += `<section class="footnotes"><ol>${footnoteItems}</ol></section>`;
        }

        return html;
      };

      const renderMarkdown = (text) => {
        contentEl.innerHTML = markdownToHtml(text);
        if (typeof renderMathInElement === "function") {
          renderMathInElement(contentEl, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ],
            throwOnError: false
          });
        }
      };

      const fetchFromSameOrigin = (fileName) =>
        fetch(new URL(`${articleDir}/${encodeURIComponent(fileName)}`, pageBase)).then((res) => {
          if (!res.ok) {
            throw new Error("same-origin");
          }
          return res.text();
        });

      const fetchFromGitHub = (fileName) => {
        const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${articleDir}/${encodeURIComponent(
          fileName
        )}`;
        return fetch(apiUrl)
          .then((res) => {
            if (!res.ok) {
              throw new Error("github-api");
            }
            return res.json();
          })
          .then((data) => {
            if (!data.content) {
              throw new Error("github-content");
            }
            const base64 = data.content.replace(/\n/g, "");
            const decoded = atob(base64);
            return decodeURIComponent(
              Array.from(decoded)
                .map((char) =>
                  `%${char.charCodeAt(0).toString(16).padStart(2, "0")}`
                )
                .join("")
            );
          });
      };

      const fetchFromRawGitHub = (fileName) => {
        const branches = ["main", "master"];
        const encoded = encodeURIComponent(fileName);
        const tryBranch = (index) => {
          if (index >= branches.length) {
            return Promise.reject(new Error("raw-github"));
          }
          const rawUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branches[index]}/${articleDir}/${encoded}`;
          return fetch(rawUrl)
            .then((res) => {
              if (!res.ok) {
                throw new Error("raw-branch");
              }
              return res.text();
            })
            .catch(() => tryBranch(index + 1));
        };
        return tryBranch(0);
      };

      const resolvedFile = (file || "").trim();
      const isValidFile =
        resolvedFile &&
        !resolvedFile.includes("/") &&
        !resolvedFile.includes("\\") &&
        /\.(md|markdown)$/i.test(resolvedFile);

      if (!isValidFile) {
        titleEl.textContent = "无法读取文章";
        contentEl.textContent = "请从首页选择文章。";
      } else {
        titleEl.textContent = resolvedFile
          .replace(/\.markdown$/i, "")
          .replace(/\.md$/i, "");
        fetchFromSameOrigin(resolvedFile)
          .then((text) => {
            renderMarkdown(text);
          })
          .catch(() =>
            fetchFromRawGitHub(resolvedFile)
              .then((text) => {
                renderMarkdown(text);
              })
              .catch(() =>
                fetchFromGitHub(resolvedFile)
                  .then((text) => {
                    renderMarkdown(text);
                  })
                  .catch(() => {
                    contentEl.textContent =
                      "无法加载文章内容，请检查文件是否存在或仓库是否公开。";
                  })
              )
          );
      }
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
